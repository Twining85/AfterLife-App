services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${TSCHLUESSLI_IMAGE_REF:-tschluessli-api:local}
    restart: unless-stopped
    env_file:
      - ${TSCHLUESSLI_ENV_FILE:-/etc/tschluessli/backend.env}
    environment:
      NODE_ENV: production
      MYSQL_SSL_CA_PATH: /run/secrets/mysql-ca.cert
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - ${TSCHLUESSLI_MYSQL_CA_FILE:-/etc/tschluessli/certs/mysql-ca.cert}:/run/secrets/mysql-ca.cert:ro
    ports:
      - "127.0.0.1:${TSCHLUESSLI_HOST_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  migrate:
    profiles: ["tools"]
    image: ${TSCHLUESSLI_IMAGE_REF:-tschluessli-api:local}
    env_file:
      - ${TSCHLUESSLI_ENV_FILE:-/etc/tschluessli/backend.env}
    environment:
      NODE_ENV: production
      MYSQL_SSL_CA_PATH: /run/secrets/mysql-ca.cert
    volumes:
      - ${TSCHLUESSLI_MYSQL_CA_FILE:-/etc/tschluessli/certs/mysql-ca.cert}:/run/secrets/mysql-ca.cert:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["node", "database/mysql/migrate.js"]

  auto-release-worker:
    image: ${TSCHLUESSLI_IMAGE_REF:-tschluessli-api:local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ${TSCHLUESSLI_ENV_FILE:-/etc/tschluessli/backend.env}
    environment:
      NODE_ENV: production
      MYSQL_SSL_CA_PATH: /run/secrets/mysql-ca.cert
    volumes:
      - ${TSCHLUESSLI_MYSQL_CA_FILE:-/etc/tschluessli/certs/mysql-ca.cert}:/run/secrets/mysql-ca.cert:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["node", "worker.js"]
