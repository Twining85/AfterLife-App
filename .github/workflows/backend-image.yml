name: Backend-Image veröffentlichen

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Unveränderlicher Release-Tag, z. B. dev-2026-09-28.1"
        required: true
        type: string
      deploy_dev:
        description: "Image nach erfolgreichem Build auf DEV bereitstellen"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "backend-v*"

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_REF: ghcr.io/twining85/tschluessli-api

jobs:
  verify:
    name: Vertrag und Syntax prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24.8.0
          cache: npm

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci --ignore-scripts

      - name: Arbeitsstand und Syntax prüfen
        run: |
          git diff --check
          node --check server.js
          node --check worker.js

      - name: Backend-Vertragstests ausführen
        run: npm test

      - name: Compose-Vertrag prüfen
        env:
          TSCHLUESSLI_ENV_FILE: .env.example
          TSCHLUESSLI_MYSQL_CA_FILE: /tmp/mysql-ca-placeholder
          TSCHLUESSLI_IMAGE_REF: ghcr.io/twining85/tschluessli-api:verification
        run: docker compose -f compose.yml config --quiet

  build:
    name: Image einmalig bauen und pushen
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Manuellen Release-Tag validieren
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[a-z0-9][a-z0-9._-]{2,63}$ ]]; then
            echo "Ungültiger Release-Tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Metadaten erzeugen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REF }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=${{ inputs.release_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Image bauen und veröffentlichen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Build-Herkunft attestieren
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_REF }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Unveränderliche Referenz ausgeben
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### Backend-Image" >> "$GITHUB_STEP_SUMMARY"
          echo '\`'"${IMAGE_REF}@${IMAGE_DIGEST}"'\`' >> "$GITHUB_STEP_SUMMARY"
          echo "Diesen Digest zuerst in DEV und nach der Abnahme unverändert in PROD verwenden." >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: Auf DEV bereitstellen
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_dev
    needs: build
    runs-on: [self-hosted, linux, x64, tschluessli-dev]
    environment: dev
    concurrency:
      group: tschluessli-dev-deployment
      cancel-in-progress: false
    steps:
      - name: Image mit Migration und Healthcheck ausrollen
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          sudo /usr/local/sbin/tschluessli-deploy "$IMAGE_DIGEST"

      - name: Bereitgestellten Digest ausgeben
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          echo "### DEV-Deployment erfolgreich" >> "$GITHUB_STEP_SUMMARY"
          echo '\`'"ghcr.io/twining85/tschluessli-api@${IMAGE_DIGEST}"'\`' >> "$GITHUB_STEP_SUMMARY"
